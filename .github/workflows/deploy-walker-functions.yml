name: Deploy Walker Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3"
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
          project_id: dojo-platform-b68a3
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Compile TypeScript
        working-directory: functions
        run: npm run build
      - name: Deploy walker application and dashboard functions only
        run: >-
          firebase deploy
          --only functions:submitWalkerApplication,functions:getWalkerApplication,functions:listPendingWalkerApplications,functions:reviewWalkerApplication,functions:saveWalkerAvailability,functions:getWalkerDashboard
          --project dojo-platform-b68a3
          --non-interactive
