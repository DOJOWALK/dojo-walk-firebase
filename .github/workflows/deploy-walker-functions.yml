name: Deploy Backend Functions - Safe Batches

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Select Functions batch
        required: true
        type: choice
        default: customer-account
        options:
          - customer-account
          - customer-booking
          - walker-mumbai
          - admin-core

permissions:
  contents: read

concurrency:
  group: dojo-walk-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing Firebase deployment credential"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
          project_id: dojo-platform-b68a3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: functions
        run: npm run build

      - name: Verify selected Functions
        id: targets
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('functions/src/index.ts', 'utf8');
          const actual = [...source.matchAll(/^export const ([A-Za-z0-9_]+)\\s*=/gm)]
            .map(match => match[1]);

          const batches = {
            'customer-account': [
              'getCustomerAccount',
              'saveCustomerAccount'
            ],
            'customer-booking': [
              'createBookingDraftMumbai',
              'getCustomerBookings',
              'cancelCustomerBooking'
            ],
            'walker-mumbai': [
              'getWalkerApplicationMumbai',
              'submitWalkerApplicationMumbai',
              'getWalkerDashboardMumbai',
              'saveWalkerAvailabilityMumbai',
              'updateWalkerBookingStatusMumbai'
            ],
            'admin-core': [
              'listAdminBookings',
              'assignWalkerToBooking',
              'listPendingWalkerApplications',
              'reviewWalkerApplication',
              'getBookingPricing',
              'setBookingPricing',
              'getAdminServiceAreas',
              'setAdminServiceArea'
            ]
          };

          const selected = batches[process.env.BATCH];
          if (!selected) {
            throw new Error('Unknown deployment batch');
          }

          const missing = selected.filter(name => !actual.includes(name));
          if (missing.length) {
            throw new Error(`Missing exports: ${missing.join(', ')}`);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `functions=${selected.join(',')}\\n`
          );

          console.log(`Selected ${selected.length} Functions.`);
          NODE

      - name: Deploy Functions one by one
        env:
          FUNCTIONS: ${{ steps.targets.outputs.functions }}
        run: |
          IFS=',' read -ra TARGETS <<< "$FUNCTIONS"

          for FUNCTION in "${TARGETS[@]}"; do
            echo "Deploying $FUNCTION"

            firebase deploy \\
              --only "functions:$FUNCTION" \\
              --project dojo-platform-b68a3 \\
              --non-interactive

            echo "Successfully deployed $FUNCTION"
          done
