name: Firebase Functions and Firestore Config Build

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-build.yml"
      - ".github/workflows/deploy-firestore-config.yml"
      - ".github/workflows/deploy-walker-functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-build.yml"
      - ".github/workflows/deploy-firestore-config.yml"
      - ".github/workflows/deploy-walker-functions.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Firebase and Firestore configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'));"
          test -s firestore.rules
      - name: Install dependencies
        working-directory: functions
        run: npm install
      - name: Report dependency audit details
        working-directory: functions
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch {
            const message = 'Dependency audit report unavailable.\n';
            console.log(message);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message);
            process.exit(0);
          }
          const vulnerabilities = report.vulnerabilities || {};
          const counts = report.metadata?.vulnerabilities || {};
          const lines = [
            '### Dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map((level) =>
              `| ${level} | ${counts[level] ?? 0} |`),
            '',
            '| Package | Severity | Direct | Advisory | Vulnerable range | Fix available |',
            '|---|---|---|---|---|---|',
          ];
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const advisories = (item.via || []).filter((entry) => entry && typeof entry === 'object');
            if (advisories.length === 0) {
              lines.push(`| ${name} | ${item.severity} | ${item.isDirect ? 'yes' : 'no'} | transitive dependency | — | ${item.fixAvailable ? JSON.stringify(item.fixAvailable) : 'no'} |`);
              continue;
            }
            for (const advisory of advisories) {
              const title = String(advisory.title || advisory.name || 'Advisory').replaceAll('|', '/');
              const url = advisory.url ? ` (${advisory.url})` : '';
              const range = String(advisory.range || '—').replaceAll('|', '/');
              lines.push(`| ${name} | ${item.severity} | ${item.isDirect ? 'yes' : 'no'} | ${title}${url} | ${range} | ${item.fixAvailable ? JSON.stringify(item.fixAvailable) : 'no'} |`);
            }
          }
          lines.push('', '### Production dependency audit (devDependencies omitted)', '');
          let productionReport = {};
          try {
            productionReport = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          } catch {
            lines.push('Production audit report unavailable.');
          }
          const productionCounts = productionReport.metadata?.vulnerabilities || {};
          lines.push('| Severity | Count |', '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map((level) =>
              `| ${level} | ${productionCounts[level] ?? 0} |`),
            '', '| Package | Severity | Advisory | Vulnerable range |', '|---|---|---|---|');
          for (const [name, item] of Object.entries(productionReport.vulnerabilities || {})) {
            const advisories = (item.via || []).filter((entry) => entry && typeof entry === 'object');
            if (advisories.length === 0) {
              lines.push(`| ${name} | ${item.severity} | transitive dependency | — |`);
            } else {
              for (const advisory of advisories) {
                const title = String(advisory.title || advisory.name || 'Advisory').replaceAll('|', '/');
                const url = advisory.url ? ` (${advisory.url})` : '';
                const range = String(advisory.range || '—').replaceAll('|', '/');
                lines.push(`| ${name} | ${item.severity} | ${title}${url} | ${range} |`);
              }
            }
          }
          lines.push('');
          const output = lines.join('\n');
          console.log(output);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output);
          NODE
      - name: Build and payment signature unit tests
        working-directory: functions
        run: npm test
      - name: Firestore security rules emulator tests
        working-directory: functions
        run: npm run test:rules
      - name: Payment finalizer Firestore emulator tests
        working-directory: functions
        run: npm run test:payment-emulator
      - name: Walker reservation concurrency Firestore emulator tests
        working-directory: functions
        run: npm run test:reservation-emulator
