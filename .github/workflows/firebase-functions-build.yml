name: Firebase Functions and Firestore Config Build

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-build.yml"
      - ".github/workflows/deploy-firestore-config.yml"
      - ".github/workflows/deploy-walker-functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-build.yml"
      - ".github/workflows/deploy-firestore-config.yml"
      - ".github/workflows/deploy-walker-functions.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Firebase and Firestore configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'));"
          test -s firestore.rules
      - name: Install dependencies
        working-directory: functions
        run: npm install
      - name: Report dependency audit details
        working-directory: functions
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const counts = report.metadata?.vulnerabilities || {};
          const lines = [
            '### Dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map((level) =>
              `| ${level} | ${counts[level] ?? 0} |`),
            '',
            '| Package | Severity | Direct | Fix available |',
            '|---|---|---|---|',
            ...Object.entries(vulnerabilities).map(([name, item]) =>
              `| ${name} | ${item.severity} | ${item.isDirect ? 'yes' : 'no'} | ${item.fixAvailable ? JSON.stringify(item.fixAvailable) : 'no'} |`),
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n'));
          NODE
      - name: Build and payment signature unit tests
        working-directory: functions
        run: npm test
      - name: Firestore security rules emulator tests
        working-directory: functions
        run: npm run test:rules
      - name: Payment finalizer Firestore emulator tests
        working-directory: functions
        run: npm run test:payment-emulator
      - name: Walker reservation concurrency Firestore emulator tests
        working-directory: functions
        run: npm run test:reservation-emulator
