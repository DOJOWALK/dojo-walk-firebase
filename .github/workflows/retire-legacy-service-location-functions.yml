name: Retire unused Service Location Functions

on:
  workflow_dispatch:
    inputs:
      confirm_retirement:
        description: "Explicitly confirm deletion of the five legacy Service Location functions"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  retire:
    if: ${{ inputs.confirm_retirement == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
          project_id: dojo-platform-b68a3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Delete only the five approved legacy functions
        run: |
          firebase functions:delete \
            activateServiceLocation \
            manageServiceLocationImportRun \
            reviewServiceLocationBoundary \
            saveServiceLocationWithNameIndex \
            setServiceLocationStatus \
            --region asia-south1 \
            --project dojo-platform-b68a3 \
            --force \
            --non-interactive

      - name: Report completion
        if: success()
        run: echo "The five explicitly listed legacy Service Location functions were deleted from asia-south1."
