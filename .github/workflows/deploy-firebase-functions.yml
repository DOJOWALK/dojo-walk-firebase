name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3"
            echo "Add the Firebase service account JSON as a GitHub Actions repository secret, then rerun this workflow."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOJO_PLATFORM_B68A3 }}
          project_id: dojo-platform-b68a3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Compile TypeScript
        working-directory: functions
        run: npm run build

      - name: Select only Functions exported by the current source
        id: function-targets
        working-directory: functions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/index.ts', 'utf8');
          const names = [...source.matchAll(/^export\s+(?:const|let|var|function|async\s+function)\s+([A-Za-z_$][\w$]*)/gm)]
            .map((match) => match[1]);
          if (names.length === 0) {
            throw new Error('No exported Firebase Functions found in functions/src/index.ts; refusing to deploy.');
          }
          const selectors = names.map((name) => `functions:${name}`).join(',');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selectors=${selectors}\n`);
          console.log(`Selected ${names.length} current Functions: ${names.join(', ')}`);
          NODE

      - name: Deploy only selected Firebase Functions
        env:
          FUNCTION_SELECTORS: ${{ steps.function-targets.outputs.selectors }}
        run: firebase deploy --only "$FUNCTION_SELECTORS" --project dojo-platform-b68a3 --non-interactive
